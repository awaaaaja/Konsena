<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#252148',
              navy: '#1e1b4b'

          boxShadow: {
            'action-btn': '0 10px 25px -3px rgba(124, 58, 237, 0.4), 0 4px 6px -4px rgba(124, 58, 237, 0.2)',

          }
        }
      }
    }

<style data-purpose="custom-layout">
    /* Lock viewport height and provide smooth mobile feel */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

<div aria-hidden="true" class="absolute -top-24 -left-24 w-72 h-72 bg-purple-200/40 rounded-full blur-3xl pointer-events-none"></div>
<div aria-hidden="true" class="absolute top-1/4 -right-20 w-64 h-64 bg-violet-200/35 rounded-full blur-3xl pointer-events-none"></div>
<!-- BEGIN: TopBar -->
<header class="relative z-20 pt-3 px-7" data-purpose="status-bar-and-navigation">
<!-- Standard iOS Status Bar -->
<div class="flex items-center justify-between text-neutral-900 text-[14px] font-semibold tracking-tight">
<span class="pl-1 font-semibold">9:41</span>
<div class="flex items-center space-x-1.5 pr-0.5">
<!-- Cellular Icon -->
<svg class="w-4 h-3.5 fill-current" fill="none" viewBox="0 0 17 12">
<rect height="3" rx="0.5" width="2.5" x="0" y="9"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="4" y="6.5"></rect>
<rect height="8" rx="0.5" width="2.5" x="8" y="4"></rect>
<rect height="11" rx="0.5" width="2.5" x="12" y="1"></rect>
</svg>

<path clip-rule="evenodd" d="M8 2.5C5.07 2.5 2.45 3.73.6 5.69a.75.75 0 0 1-1.07-1.05C1.86 2.3 4.77 1 8 1c3.23 0 6.14 1.3 8.47 3.64a.75.75 0 0 1-1.07 1.05C13.55 3.73 10.93 2.5 8 2.5zm-5.18 5.3a.75.75 0 0 1-.02-1.06 6.46 6.46 0 0 1 10.4 0 .75.75 0 1 1-1.12 1A4.96 4.96 0 0 0 8 5.75c-1.42 0-2.71.59-3.64 1.54a.75.75 0 0 1-1.06.01l-.48-.5zm2.74 2.82a.75.75 0 0 1 0-1.06C6.26 8.86 7.09 8.5 8 8.5c.91 0 1.74.36 2.44 1.06a.75.75 0 0 1-1.06 1.06 1.95 1.95 0 0 0-2.76 0 .75.75 0 0 1-1.06 0l-.18-.18z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<svg class="w-6 h-3" fill="none" viewBox="0 0 25 12">
<rect height="11" rx="3.5" stroke="currentColor" width="21" x="0.5" y="0.5"></rect>
<rect fill="currentColor" height="8" rx="2" width="16" x="2" y="2"></rect>
<path d="M23 4.5V7.5" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path>

</div>
</div>

<div class="flex justify-end mt-3 pr-1">
<button aria-label="Lewati onboarding" class="text-brand-navy hover:text-brand-700 text-sm font-semibold tracking-wide transition-colors focus:outline-none">
          Lewati
        </button>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: HeroIllustration -->

<section aria-label="Hero Illustration" class="relative z-10 flex-1 flex items-center justify-center -mt-2" data-purpose="hero-illustration"><div class="relative flex items-center justify-center w-full px-6 py-4"><div aria-hidden="true" class="absolute w-56 h-56 bg-purple-300/30 rounded-full blur-2xl pointer-events-none -z-10"></div><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBU7agUwkv7xG4PqQRw5fjCFa5Cu8Ew92kOu9cXrGv_CxnN7I1hiWWufWDL5_ZnAFmB29hCOZWCG9cDD-8H8jezBYUnE67YqowXg7vt4FNS7_QXk5T9IHcPPqdAdVspgwRo-5OOCIvLLb27xedzxXvfgeXdFVHsK9iygm8AIO08f0Z-jvyuLiwG5A9wssZqW0mWADW5ac-Nete5sV79TUSd88-6nCDdaS9qbt4xrn4QdgUdBPJZq7fz" alt="Ilustrasi Kebijakan Privasi 3D" class="w-64 max-w-[260px] h-auto object-contain select-none pointer-events-none transition-transform duration-300 hover:scale-[1.02]" style="mix-blend-mode: multiply;"></div></section>

<!-- BEGIN: ContentAndActions -->
<!-- Text copy, pagination, and continue button -->
<section class="relative z-20 px-8 pb-3 flex flex-col justify-end" data-purpose="onboarding-content">
<!-- Typography Block -->
<div class="text-center mb-10">
<!-- Main Headline -->
<h1 class="text-[23px] leading-[1.3] font-bold text-brand-900 tracking-tight mb-3.5 px-1">
          Ubah Kebijakan Privasi yang Rumit Jadi Mudah Dipahami
        </h1>
<!-- Descriptive Paragraph -->
<p class="text-[13.5px] leading-relaxed text-slate-500 font-normal max-w-[290px] mx-auto">
          Analisis dengan AI, sesuai preferensimu, dan mengacu pada UU Pelindungan Data Pribadi.
        </p>
</div>
<!-- Action Row: Indicators + Next CTA -->
<div class="flex items-center justify-between pt-1 pb-4">
<!-- Pagination Dots -->
<div aria-label="Langkah Onboarding" class="flex items-center space-x-1.5 pl-2" role="tablist">
<!-- Active Dot (Elongated capsule) -->
<span aria-label="Halaman 1" aria-selected="true" class="w-6 h-2 bg-brand-600 rounded-full transition-all duration-300" role="tab"></span>
<!-- Inactive Dots -->
<span aria-label="Halaman 2" aria-selected="false" class="w-2 h-2 bg-brand-200 rounded-full transition-all duration-300" role="tab"></span>
<span aria-label="Halaman 3" aria-selected="false" class="w-2 h-2 bg-brand-200 rounded-full transition-all duration-300" role="tab"></span>
<span aria-label="Halaman 4" aria-selected="false" class="w-2 h-2 bg-brand-200 rounded-full transition-all duration-300" role="tab"></span>
</div>
<!-- Next Floating Circular Button -->
<button aria-label="Selanjutnya" class="w-14 h-14 bg-gradient-to-tr from-[#6d28d9] to-[#7c3aed] hover:from-[#5b21b6] hover:to-[#6d28d9] active:scale-95 text-white rounded-full flex items-center justify-center shadow-action-btn transition-transform duration-150 focus:outline-none focus:ring-4 focus:ring-purple-300">
<svg class="w-6 h-6 stroke-[2.5] stroke-current fill-none" viewBox="0 0 24 24">
<path d="M13.5 4.5L20.25 12m0 0l-6.75 7.5M20.25 12H3.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- iOS Home Indicator Bar -->
<div aria-hidden="true" class="w-full flex justify-center pb-2 pt-2">
<div class="w-32 h-1 bg-neutral-900/80 rounded-full"></div>
</div>
